# HumanoidKick_Fix 전용 env cfg. humanoid_ball_pos_task_1.yaml 을 바탕으로 했고 설계는 kick_fix_plan.md.
#   공: ballProfile, plane 은 프로필의 ground 값으로 덮어쓴다.
# if given, will override the device setting in gym.
env:
  numEnvs: 4096
  envSpacing: 5
  episodeLength: 120
  isFlagrun: False
  enableDebugVis: False

  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 2 # 30 Hz
  stateInit: "Default"
  hybridInitProb: 0.5
  numAMPObsSteps: 10
  numAMPEncObsSteps: 60

  localRootObs: True
  keyBodies: ["right_hand", "left_hand", "right_foot", "left_foot"]
  contactBodies: ["right_foot", "left_foot"]  # 넘어짐 판정용
  terminationHeight: 0.15
  enableEarlyTermination: True

  enableTaskObs: True

  # HumanoidBallPos_1.__init__ 이 읽는 값 (Kick_Fix 에서는 쓰지 않음)
  strikeBodyNames: ["left_foot", "right_foot"]
  tarDistMin: 50
  tarDistMax: 50
  tarSpeedMin: 15
  tarSpeedMax: 30
  tarHeightMin: 0
  tarHeightMax: 50

  # 초기 상태
  INIT_FILE_PROB: 0.9            # 리셋 때 상태 파일에서 시작할 확률 (나머지는 원본 기본 배치, 공 정지). 0 이면 파일을 읽지 않음
  INIT_FILES:                    # 파일에서 시작하는 env 는 이 중 하나를 균등하게 고른다
    - blackhole/init_states/dribble_init_state_final.pkl   # 드리블 중 (공 바닥)
    - blackhole/init_states/trap_init_state_air_v2.pkl     # 트래핑 접촉 직후 (공 대부분 공중)
    - blackhole/init_states/trap_init_state_ground_v2.pkl     # 트래핑 접촉 직후 (공 대부분 공중)

  # 목표 (리셋 때 뽑아 에피소드 동안 고정)
  TAR_AZ_RANGE: 45.0             # 방위각 = root -> 공 방향 ± 이 값 [deg]
  TAR_ELEV_MIN: 10.0             # 뜬 공 고각 U(min, max) [deg]. 땅볼 목표 (고각 0) 와 구별되도록 하한을 둔다 (기존 0)
  TAR_ELEV_MAX: 30.0
  TAR_SPEED_MIN: 8.0             # 목표 공 속력 [m/s]
  TAR_SPEED_MAX: 30.0
  GROUND_PROB: 0.4               # 땅볼 목표 확률 (고각 0, 보상은 수평 성분만 x 높이 계수). 0 이면 뜬 공 목표만
  GROUND_HEIGHT_MAX: 0.3         # 땅볼 높이 계수: 공 아래쪽 높이 0.02 m (GROUND_EPS) 이하 1, 이 높이까지 선형으로 0 [m]
  GROUND_SPEED_MIN: 5.0          # 땅볼 목표 공 속력 [m/s]
  GROUND_SPEED_MAX: 20.0
  TAR_VIS_DIST: 50.0            # 표시용 타겟을 공에서 목표 방향으로 이 거리에 둔다 [m]

  # 킥 판정 / 종료
  KICK_DV_THR: 0.5               # 바닥으로 설명되지 않는 공 충격량 (질량당, control step 당) [m/s]. 접촉 없을 때 실측 최대 0.07
  KICK_SPEED_MIN: 5.0            # 터치 직후 공 속력이 이 이상이어야 킥 (약한 터치는 킥이 아님) [m/s]
  KICK_WINDOW_STEPS: 10          # 킥 판정 후 이 step 뒤 종료
  HANDBALL_THR: 1.0              # 팔 / 손 (upper_arm, lower_arm, hand) 접촉력이 이보다 크면 종료 [N]

  # test 전용 (학습 때는 무시): 리셋 때 이 확률로 넘어진 자세에서 시작. 0 = 끔 (fall_init.py)
  FALL_INIT_PROB: 1.0
  FALL_GRACE_STEPS: 90           # 넘어진 채 시작한 env 는 이 step 동안 넘어짐 / 핸드볼로 끝나지 않음 (30 Hz 에서 3 s)

  asset:
    assetRoot: "calm/data/assets"
    assetFileName: "mjcf/amp_humanoid_shoe.xml"

  # ball + ground (plane) physics: calm/data/cfg/soccer_hlc/ball/<ballProfile>.yaml (physicsfc_legacy = 원본 BallPos_1 값)
  ballProfile: linear_damping_and_mjfriction
  ballOverrides: {}

sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1  # 0: pgs, 1: tgs
    num_position_iterations: 4
    num_velocity_iterations: 0
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 10.0
    default_buffer_size_multiplier: 10.0

  flex:
    num_inner_iterations: 10
    warm_start: 0.25
