# if given, will override the device setting in gym. 
env: 
  numEnvs: 4096
  envSpacing: 5
  episodeLength: 50000
  isFlagrun: False
  enableDebugVis: False
  
  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 2 # 30 Hz
  stateInit: "Default"
  hybridInitProb: 0.5
  numAMPObsSteps: 10
  numAMPEncObsSteps: 60
  
  localRootObs: True
  keyBodies: ["right_hand", "left_hand", "right_foot", "left_foot"]
  contactBodies: ["right_foot", "left_foot"]
  terminationHeight: 0.15
  enableEarlyTermination: False
  
  # hyper parameters
  tarSpeedMin: 0
  tarSpeedMax: 7
  headingChangeStepsMin: 100
  headingChangeStepsMax: 200
  VEL_ERR_SCALE: 0.25
  TANGENT_ERR_W: 0.1
  DIR_REWARD_W: 0.7
  FACING_REWARD_W: 0.3

  enableRandHeading: True
  enableTaskObs: True

  asset:
    assetRoot: "calm/data/assets"
    assetFileName: "mjcf/amp_humanoid_shoe.xml" # mjcf/amp_humanoid.xml

  plane:
    staticFriction: 1.0
    dynamicFriction: 1.0
    restitution: 0.0

sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1  # 0: pgs, 1: tgs
    num_position_iterations: 4
    num_velocity_iterations: 0
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 10.0
    default_buffer_size_multiplier: 10.0

  flex:
    num_inner_iterations: 10
    warm_start: 0.25

evaluation:
  task: move
  eval_delay: 30
  change_steps: 150 # after change_steps change to next testcase. 30 step is 1 sec for default.
  batch_num: 100
  batch_size: 30
  gain_criteria_frame: 10
  criteria_angle: 10 #degree
  criteria_speed: 0.5 #m/s
