# if given, will override the device setting in gym. 
env: 
  powerScale: 1.0
  controlFrequencyInv: 2 # 30 Hz
  stateInit: "Default"
  hybridInitProb: 0.5
  numAMPObsSteps: 10
  numAMPEncObsSteps: 60
  
  localRootObs: True
  keyBodies: ["right_hand", "left_hand", "right_foot", "left_foot"]
  contactBodies: ["right_foot", "left_foot"]
  terminationHeight: 0.15
  enableEarlyTermination: False
  
  # move, dribble
  tarSpeedMin: .5
  tarSpeedMax: 5.0
  headingChangeStepsMin: 100
  headingChangeStepsMax: 200
  enableRandHeading: True
  enableTaskObs: True
  rootRelocateDist: 1
  ballRelocateDist: 2
  relocate_dist: 2.0

  # trap
  initialBallDistMin: 5 # 1
  initialBallDistMax: 10 # 3
  initialBallSpeedMin: 2 # 0.5
  initialBallSpeedMax: 5 # 3.
  initialBallHeightMin: 2
  initialBallHeightMax: 3
  initialBallSpeedZMin: -2 #-1.5
  initialBallSpeedZMax: 0 #0.5

  # kick
  ball_dist_min: 1.0
  ball_dist_max: 3.0
  tar_dist_min: 50.0
  tar_dist_max: 50.0
  tar_height_min: 0.0
  tar_height_max: 2.0
  tar_speed_min: 40.0
  tar_speed_max: 60.0

  asset:
    assetRoot: "calm/data/assets"
    assetFileName: "mjcf/amp_humanoid_shoe.xml"

  plane:
    staticFriction: 1.0
    dynamicFriction: 1.0
    restitution: 0.2

sim:
  dt: 0.0166
  substeps: 2
  up_axis: 1 # 0: Y-axis, 1: Z-axis
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: 4
    solver_type: 1  # 0: pgs, 1: tgs
    num_position_iterations: 4
    num_velocity_iterations: 0
    contact_offset: 0.02
    contact_collection: 1
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 10.0
    default_buffer_size_multiplier: 10.0
