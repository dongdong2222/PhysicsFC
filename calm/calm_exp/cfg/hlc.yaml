name: hrl
separate: True

space:
  continuous:
    mu_activation: None
    sigma_activation: None
    mu_init:
      name: default
    sigma_init:
      name: const_initializer
      val: -2.3
    fixed_sigma: True
    learn_sigma: False

mlp:
  units: [1024, 512]
  activation: relu
  d2rl: False
  n_skills: 3

  initializer:
    name: default
  regularizer:
    name: None
    